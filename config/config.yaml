# ChronoFlow 配置文件
# MySQL 权威调度 + Transactional Outbox + Redis Streams

server:
  port: 8080
  mode: debug  # debug, release, test

runtime:
  # 收到 SIGINT/SIGTERM 后等待 HTTP 请求和后台执行退出的最长秒数
  shutdown_timeout_seconds: 15

database:
  dsn: "root:123456@tcp(127.0.0.1:3306)/chronoflow?charset=utf8mb4&parseTime=True&loc=UTC"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 60  # 分钟
  # 禁止默认记录每条 SQL，避免回调快照和 Header 出现在日志中
  log_level: warn

migrations:
  path: "migrations"

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 1

scheduler:
  # MySQL 权威调度轮询间隔
  poll_interval_ms: 500
  # 单事务最多领取的到期 Timer 数
  batch_size: 100
  misfire_grace_seconds: 5
  default_max_catch_up: 10

outbox:
  poll_interval_ms: 200
  batch_size: 100
  claim_ttl_seconds: 30
  max_backoff_seconds: 30
  stream: "chronoflow:execution:ready"
  consumer_group: "chronoflow-workers"
  # 0 表示不在发布时截断；待 Worker 安全清理已确认消息
  stream_max_len: 0

worker:
  pool_size: 100
  read_count: 20
  read_block_ms: 2000
  lease_ttl_seconds: 30
  heartbeat_seconds: 10
  reclaim_idle_seconds: 30
  reclaim_interval_seconds: 10
  http_timeout_seconds: 12
  max_response_bytes: 1048576
  retry_base_seconds: 2
  retry_max_seconds: 60

recovery:
  enabled: true
  scan_interval_seconds: 10
  batch_size: 100
  pending_stale_seconds: 30
  cleanup_interval_minutes: 60
  outbox_retention_days: 7
  execution_retention_days: 30
  stream_retention_hours: 24

security:
  # 非空时，/api/* 请求必须携带 X-API-Key 或 Bearer Token
  api_key: ""
  allowed_origins:
    - "http://localhost:3000"
  # 生产环境应保持 false；仅本地回调测试时覆盖为 true
  allow_private_callbacks: false
  max_request_bytes: 1048576

monitoring:
  # 管理端历史曲线由后端代理查询 Prometheus
  prometheus_url: "http://localhost:9090"
  # 管理端通过后端同源路径嵌入 Grafana dashboard
  grafana_url: "http://localhost:3001"

log:
  level: info
  format: json    # json, console
  output: stdout  # stdout, file
  file_path: ""
