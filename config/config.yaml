# ChronoFlow 配置文件
# 基于 xTimer 架构的分布式定时任务调度系统

server:
  port: 8080
  mode: debug  # debug, release, test

database:
  driver: mysql
  dsn: "root:123456@tcp(127.0.0.1:3306)/chronoflow?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 60  # 分钟

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 1
  pool_size: 100

scheduler:
  # Migrator 执行间隔（分钟），默认 60 分钟
  migrate_step_minutes: 60
  # 二级时间步（秒），本地定时器定义及状态缓存有效期，默认 2 分钟
  step2_duration: 120
  # 每分钟初始扫描桶数
  base_bucket_num: 1
  # 动态分桶允许扩展到的最大桶数
  bucket_num: 3
  # 每个桶承载的目标投递任务数；累计任务量超过容量时只增不减地扩桶
  tasks_per_bucket: 100
  # 时间片结束后，Redis 队列及分桶元数据继续保留的秒数
  bucket_metadata_ttl: 600
  # Scheduler 轮询间隔（秒）
  scan_interval: 1
  # 分布式锁初始 TTL（秒），必须大于时间片时长（60 秒）
  lock_expiration: 70
  # 分片扫描成功后的锁保留 TTL（秒），覆盖上一分钟回扫窗口
  success_expiration: 130
  # 调度扫描协程池大小
  worker_pool_size: 16

trigger:
  # HTTP 回调执行协程池大小
  worker_pool_size: 100

monitoring:
  # Gauge 指标采集间隔（秒）
  collect_interval_seconds: 10
  # PENDING 记录晚于计划时间多少秒后视为超期
  pending_overdue_seconds: 120
  # RUNNING 记录执行多少秒后视为卡住
  running_stale_seconds: 60
  # 管理端历史曲线由后端代理查询 Prometheus
  prometheus_url: "http://localhost:9090"

log:
  level: info
  format: json    # json, console
  output: stdout  # stdout, file
  file_path: ""
