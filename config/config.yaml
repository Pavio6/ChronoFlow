# ChronoFlow 配置文件
# 基于 xTimer 架构的分布式定时任务调度系统

server:
  port: 8080
  mode: debug  # debug, release, test

database:
  driver: mysql
  dsn: "root:123456@tcp(127.0.0.1:3306)/chronoflow?charset=utf8mb4&parseTime=True&loc=Local"
  max_open_conns: 100
  max_idle_conns: 10
  conn_max_lifetime: 60  # 分钟

redis:
  addr: "127.0.0.1:6379"
  password: ""
  db: 1
  pool_size: 100

scheduler:
  # Migrator 执行间隔（分钟），默认 60 分钟
  migrate_step_minutes: 60
  # 二级时间步（秒），内存缓存刷新间隔，默认 5 分钟
  step2_duration: 300
  # 分桶数量（支持动态调整）
  bucket_num: 3
  # Scheduler 轮询间隔（秒）
  scan_interval: 1
  # 分布式锁初始 TTL（秒），必须大于时间片时长（60 秒），参考 xTimer tryLockSeconds
  lock_expiration: 70
  # 任务处理完成后锁的 TTL（秒），防止过期释放，参考 xTimer successExpireSeconds
  success_expiration: 130

executor:
  # HTTP 回调超时（秒）
  timeout: 30
  # 协程池大小
  worker_pool_size: 100

log:
  level: info
  format: json    # json, console
  output: stdout  # stdout, file
  file_path: ""
